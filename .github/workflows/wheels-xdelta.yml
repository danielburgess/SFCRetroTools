name: build-xdelta-wheels

on:
  push:
    tags:
      - "xdelta-v*"
    branches:
      - main
    paths:
      - "packages/retrotool-xdelta/**"
      - ".github/workflows/wheels-xdelta.yml"
  pull_request:
    paths:
      - "packages/retrotool-xdelta/**"
      - ".github/workflows/wheels-xdelta.yml"
  workflow_dispatch:

jobs:
  build-wheels:
    name: wheel ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-latest
            arch: aarch64
          - os: windows-latest
            arch: AMD64

    steps:
      - uses: actions/checkout@v4

      - name: Check out only this package's vendored submodule
        run: git submodule update --init --depth 1 packages/retrotool-xdelta/vendor/xdelta

      - name: Set up QEMU (linux aarch64)
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # xdelta3 builds via MSVC on Windows (setup.py runs `msbuild
      # xdelta3.vcxproj`); just put msbuild on PATH so cibuildwheel's build
      # subprocess can find it. No MSYS2/autotools needed on Windows.
      - name: Set up MSBuild (windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
        with:
          package-dir: packages/retrotool-xdelta
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-xdelta-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  build-sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out only this package's vendored submodule
        run: git submodule update --init --depth 1 packages/retrotool-xdelta/vendor/xdelta

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist packages/retrotool-xdelta --outdir dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist-xdelta
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/xdelta-v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
