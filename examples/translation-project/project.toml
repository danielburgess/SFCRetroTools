# project.toml — a complete, runnable retrotool TRANSLATION PROJECT.
#
# This example translates a synthesized "demo game" (tools/make_demo_rom.py)
# from Japanese to English, exercising the same workflow a real fan
# translation uses:
#
#   python tools/make_demo_rom.py     # stand-in for your legally-owned ROM
#   retrotool build .                 # -> out/demo_en.sfc with the EN script
#   retrotool edit .                  # GUI editor over data/en (JP reference)
#   retrotool extract . --lang jp     # re-derive data/jp from the ROM
#   retrotool lang new --to fr        # stage a French translation
#
# Top-level scalars MUST come before any [section] header (TOML rule).

# Folders scanned for DataDef tomls (each one describes a block of game
# data — see defs/dialog.toml for the annotated example).
data_dirs = ["defs"]

# Per-language script roots. `retrotool extract --lang X` writes to the
# matching dir; `build_lang` picks which one the build reads from.
jp_data_dir = "data/jp"
en_data_dir = "data/en"

# The language whose files `retrotool build` inserts (and `retrotool edit`
# opens). `retrotool lang new` updates this when staging a new language.
build_lang = "en"

[rom]
# Built ROM name -> <output_dir>/<name>.sfc
name = "demo_en"
# The pristine source ROM. Gitignored in real projects (copyright — never
# distribute it); here it is generated by tools/make_demo_rom.py.
file = "roms/game.sfc"
mapping = "lorom"
size = "512K"

[rom.build]
output_dir = "out"

# Default placement mode for script sections that don't set their own
# (defs/dialog.toml sets relocate explicitly; this is belt-and-braces and
# what you'd reach for with many DataDefs).
[rom.build.section.placement]
mode = "relocate"

[extract]
# `retrotool extract .` with no --lang/--dest writes here. Deliberately the
# SOURCE language: extraction regenerates the original-script dump, it
# should never silently clobber your translation.
default_lang = "jp"

# ---------------------------------------------------------------------------
# Script editor (`retrotool edit .`) — optional; sensible defaults cover
# most of this. See the README "retrotool edit" section for every key.
# ---------------------------------------------------------------------------
[editor]
# lang / data_dir / reference (jp) / tables are all auto-discovered from the
# scalars above and tables/*_<lang>.tbl. We only set the dialog width the
# overflow checker should enforce (in 8px half-cells, i.e. characters).
cols_per_line = 24

# The demo engine's control codes happen to match the editor defaults
# (FD = newline, FE = page break, FF = terminator, F7-FB 2-byte opcodes),
# so no [editor.control_codes] table is needed. A real game overrides them:
#   [editor.control_codes]
#   newline = "FD"
#   terminator = "FF"
#   opcodes = { F7 = 2 }
#
# Pixel-accurate preview needs the game font; the demo has none, so the
# editor runs text-only. A real project enables it with:
#   [editor.preview]
#   font = "fonts/game_font.bin"
#   palette_table = "0x058313"
